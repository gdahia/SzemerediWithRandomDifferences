name = "SzemerediWithRandomDifferences"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SzemerediWithRandomDifferences", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "DensityHalesJewett"
git = "https://github.com/gdahia/DensityHalesJewett"
rev = "478533c44dbfbb286362cb37e19b0ba53fdc5120"

# Keep Mathlib last so that its pin takes precedence.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# The full proof development; `Solution.lean` imports it.
[[lean_lib]]
name = "SzemerediWithRandomDifferences"

# The small statement-only surface a reader audits.
[[lean_lib]]
name = "Challenge"
roots = ["SzemerediWithRandomDifferencesPalomar.Challenge"]

# Proves the declarations stated in `Challenge.lean`; Comparator checks the two agree.
[[lean_lib]]
name = "Solution"
roots = ["SzemerediWithRandomDifferencesPalomar.Solution"]
