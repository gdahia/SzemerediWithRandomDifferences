# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Szemerédi's theorem with random differences"
  description: >-
    Lean 4 formalization of a threshold for Szemerédi's theorem with random differences.
    There is c > 0 such that, for k ≥ 3, δ > 0 and p ≥ C n^(-c / log log k), a p-random set
    D of differences in {1, …, n} has the following property with probability tending to 1:
    every subset of {1, …, n} with at least δn elements contains a k-term arithmetic
    progression with common difference in D. The proof uses the Green–Ruzsa construction of
    small sets containing a progression with every common difference, which is also
    formalized.
  authors:
    - name: "Gabriel Dahia"
      github: "gdahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Gabriel Dahia"
      github: "gdahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11B25", "11B30", "05D40"]

sources:
  - title: "Szemerédi's theorem with random differences and Arithmetic Kakeya"
    authors:
      - "Gabriel Dahia"
    type: "preprint"
    relationship: "formalizes"
    note: >-
      Theorem 1.1 and Lemma 1.2. The preprint is not yet public. See fidelity.divergences
      for the differences from it.
    license: "unknown"
    author_endorsement: "participated"
  - title: "On the arithmetic Kakeya conjecture of Katz and Tao"
    authors:
      - "Ben Green"
      - "Imre Z. Ruzsa"
    id: "arXiv:1712.02108"
    type: "article"
    location: "https://arxiv.org/abs/1712.02108"
    relationship: "formalizes"
    note: >-
      The construction of Section 5, which proves Theorem 1.2. See fidelity.divergences for
      the differences from the paper.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/gdahia/DensityHalesJewett"
    relationship: "builds-on"
    note: >-
      A Lake dependency. It provides the structure ArithmeticProgression and Varnavides'
      theorem, Combinatorics.ArithmeticProgression.exists_many_of_density_nat.

status:
  scope: >-
    The project proves Theorem 1.1 of the preprint, the fingerprint lemma (Lemma 1.2), and
    Theorem 1.2 of Green and Ruzsa in a finite form with explicit constants. Varnavides'
    theorem is taken from the DensityHalesJewett project. The random set of differences is
    Mathlib's setBernoulli measure. The project does not define F_k(N) or state the
    Green–Ruzsa theorem as a limit, and does not formalize the other results of that paper.
    The sorry counts below refer to the library and Solution.lean; Challenge.lean contains
    one statement placeholder.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Set up the repository, read the preprint and the arXiv source of Green and Ruzsa,
        wrote the statements and the proofs, and checked them with the Lean compiler. Gabriel
        Dahia fixed the form of the Green–Ruzsa statement, the definitions, the names, the
        module structure and the proof style.
      cost:
        wall_time: "one session over two days"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        The first requests covered the Palomar layout, the CI and the statement of the
        Green–Ruzsa theorem with explicit c and n₀. Its intermediate lemmas were stated with
        sorry for review and proved afterwards, without raising heartbeats or adding axioms.
        Later requests covered naming and proof style, and then the main theorem of the
        preprint, with Varnavides' theorem imported from DensityHalesJewett.
  spend_usd: "not tracked"
  notes: >-
    Claude Code wrote the Lean code and this file under the direction of Gabriel Dahia. The
    library and Solution.lean build without sorry. The solution theorem uses propext,
    Classical.choice and Quot.sound only.

fidelity:
  divergences: >-
    Theorem 1.1. The probability is that of the event that some S ⊆ {1, …, n} with
    |S| ≥ δn has no k-term progression with common difference in D, where D has law
    setBernoulli({1, …, n}, p(n)). The hypothesis on p is required for all large n. The
    proof bounds the probability by (kQ + 1) n exp(-2 n^(1 - c / log log k)), with
    C = 3 / γ.

    Lemma 1.2. The family has at most (kQ + 1) n exp(n^(1 - c / log log k)) members, and
    the common differences of a fingerprint are counted inside {1, …, n}. The constant is
    γ = ε(δ/2, k) / (kQ + 1), where ε is the constant in Varnavides' theorem; the density
    δ/2 appears because that theorem is stated for subsets of {0, …, n}. Translation by
    negative integers is avoided: the fingerprints are images of subsets of the
    Green–Ruzsa set under y ↦ y + n - u with u < (kQ + 1) n.

    Green–Ruzsa. The paper states Theorem 1.2 as a bound on the limit of
    log F_k(N) / log N. The Lean statement is the finite bound #Y ≤ n^(1 - c / log log k)
    for n ≥ n₀(k), with c = 1/100 and n₀(k) = Q^(⌈10 log log k⌉ + 100), where Q is the
    product of the first ⌈10 log k⌉ odd primes as in the paper. The set lies in
    {1, …, kQn}.

    The paper proves #S ≤ Q^(1 - c / log log k) for large k from the bound
    ∏ (1 + 1/p) ≪ log m. The Lean proof covers every k ≥ 3. It uses 2p / (p + 1) ≥ 7/4 for
    p ≥ 7 to get B k³ ≤ Q, where B = k² ∏ (p + 1)/2, and the bound pₙ ≤ (n + 2)², derived
    from Chebyshev's estimate in Mathlib, to get log Q ≤ 22 log k (log log k + 13/5). The
    case k = 3 uses the values Q = 3710369067405 and B = 44677785600.

    The paper absorbs a factor of Q into an implied constant depending on k. The Lean proof
    absorbs it using n ≥ n₀(k).

    The starting point of the progression of difference d is the residue of d² in
    {0, …, Q - 1} rather than {1, …, Q}, and the final set is shifted by one.

review:
  status: "partially reviewed"
  reviewers:
    - "Gabriel Dahia"
  notes: >-
    Reviewed the statements of the Green–Ruzsa part and, in part, the style of its proofs.
    The statements and proofs on random differences have not been reviewed yet.

alignment:
  namespace: "RandomDifferences"
  statements:
    - source: "Theorem 1.1"
      lean: "RandomDifferences.exists_forall_tendsto_setBernoulli_exists_forall_exists_notMem"
    - source: "Theorem 1.1, with explicit constants"
      lean: "RandomDifferences.tendsto_setBernoulli_isAvoidable"
    - source: "Lemma 1.2"
      lean: "RandomDifferences.exists_card_le_forall_exists_subset_forall_le_ncard"
    - source: "Theorem 2.1 (Varnavides)"
      lean: "Combinatorics.ArithmeticProgression.exists_many_of_density_nat"
    - source: "Theorem 2.2 (Green–Ruzsa, Theorem 1.2)"
      lean: "ArithmeticKakeya.exists_card_le_rpow_forall_exists_arithmeticProgression"
    - source: "Green–Ruzsa, Section 5, the set A_n"
      lean: "ArithmeticKakeya.exists_card_le_pow_forall_exists_arithmeticProgression"
    - source: "Green–Ruzsa, Section 5, the bound on #S"
      lean: "ArithmeticKakeya.card_baseSet_le"

acknowledgements: "Mathlib."
